
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: elainsuoja_user
      POSTGRES_PASSWORD: vPRCGj3GY9oR4QNQ
      POSTGRES_DB: elainsuoja
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/initialize.sql:/docker-entrypoint-initdb.d/01-initialize.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elainsuoja_user -d elainsuoja"]
      interval: 5s
      timeout: 5s
      retries: 10

  adoption-server:
    restart: always
    build:
      context: ./backend/adoption-server
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      PGHOST: db
      PGUSER: elainsuoja_user
      PGPASSWORD: vPRCGj3GY9oR4QNQ
      PGDATABASE: elainsuoja
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  server-a:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      PGHOST: db
      PGUSER: elainsuoja_user
      PGPASSWORD: vPRCGj3GY9oR4QNQ
      PGDATABASE: elainsuoja
      ADOPTION_SERVER_URL: "http://adoption-server:3001"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
